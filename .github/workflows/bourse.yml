name: Bourse Signal Bot

on:
  schedule:
    # اجرا هر ۱۵ دقیقه در روزهای کاری (شنبه تا چهارشنبه از ۸:۳۰ تا ۱۲:۴۵ به وقت ایران)
    - cron: '*/15 5-9 * * 0-4'
  workflow_dispatch:

jobs:
  run-bourse-bot:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Run Bourse Bot Script
        env:
          BALE_TOKEN: ${{ secrets.BALE_TOKEN }}
          BALE_CHAT_ID: ${{ secrets.BALE_CHAT_ID }}
          IRAN_PROXY: ${{ secrets.IRAN_PROXY }}
        run: |
          python bourse_bot.py
          
