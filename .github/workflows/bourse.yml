name: Bourse Iran Signal Bot

on:
  schedule:
    # اجرای خودکار در روزهای کاری بورس (شنبه تا چهارشنبه)
    # ساعت‌های 09:15, 10:30, 11:45 به وقت ایران (معادل UTC)
    - cron: '45 5,6,7,8 * * 0,1,2,3,6'
  workflow_dispatch:

jobs:
  run-bourse-bot:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests urllib3 pandas

      - name: Run Bourse Bot
        env:
          BALE_TOKEN: ${{ secrets.BALE_TOKEN }}
          BALE_CHAT_ID: ${{ secrets.BALE_CHAT_ID }}
          TZ: 'Asia/Tehran'
        run: python bourse_bot.py

      - name: Commit and Push State File
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add bourse_state.json || true
          git commit -m "Update bourse state [skip ci]" || true
          git push origin main || true
          
